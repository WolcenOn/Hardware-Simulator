name: Playwright E2E

on:
  push:
    branches: [feature/v7-procedural-3d]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript test syntax before browser matrix
        run: |
          node --check tests/e2e/workshop.spec.mjs
          node --check tests/smoke.mjs
          node --check playwright.config.mjs
          node --check js/adventureMode.js
          node --check js/workshopTools.js
          node --check js/pinoutLab.js
          node --check js/pinoutBoard3d.js
          node --check tests/pinoutLab.test.mjs
          node --check js/toolRack3d.js
          node --check tests/workshopTools.test.mjs
          node --check js/timeEngine.js
          node --check js/operationEngine.js
          node --check js/mishapEngine.js
          node --check js/ramPrecision.js
          node --check js/screwPrecision.js
          node --check js/cpuPrecision.js
          node --check js/thermalPaste.js
          node --check js/pasteGameplay.js
          node --check tests/mishaps.test.mjs
          node --check tests/ramPrecision.test.mjs
          node --check tests/screwPrecision.test.mjs
          node --check tests/cpuPrecision.test.mjs
          node --check tests/thermalPaste.test.mjs
          node --check tests/thermalPasteUI.test.mjs
          node --check tests/operations.test.mjs
          node --check tests/time.test.mjs
      - name: Run operation and time unit tests
        run: npm run test:operations
      - name: Run regression smoke tests
        run: npm run test:smoke

  hdd:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose HDD installation specifically
        run: npx playwright test --project=chromium-desktop --grep "HDD de 3,5|SSD y HDD" --workers=1 --retries=0 --reporter=list
      - name: Upload HDD diagnosis and trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hdd-diagnosis-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  os-boot:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test fictional OS installation and boot
        run: npx playwright test --project=chromium-desktop --grep "sin SO ni USB|NovaDesk comprueba|LibreForge permite" --workers=1 --retries=0 --reporter=list
      - name: Upload boot tests report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: os-boot-report-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  usb-market:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test USB preparation, purchase and physical connection
        run: 'npx playwright test --project=chromium-desktop --grep "USB de tienda:" --workers=1 --retries=0 --reporter=list'
      - name: Upload USB market diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb-market-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  classroom:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test teacher JSON and thermal protection
        run: npx playwright test --project=chromium-desktop --grep "profesor importa caso JSON|fallo térmico provoca" --workers=1 --retries=0 --reporter=list
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-tests-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tests
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser scenarios (one browser per runner)
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --workers=1 --retries=0 --reporter=list
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
